<title>History of Japan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a studio desk - the film on a sheet of paper, mixer and parts list beneath. */
  @font-face { font-family: "KalamBold"; src: url("japan/fonts/KalamBold.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "PatrickHand"; src: url("japan/fonts/PatrickHand.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "GochiHand"; src: url("japan/fonts/GochiHand.woff2") format("woff2"); font-display: swap; }
  :root {
    --paper: #f3ede0;
    --card: #fbf8f0;
    --ink: #1f2a55;
    --ink-soft: #55608a;
    --rule: #d8cdb6;
    --red: #c4472b;
    --moss: #4f7f3f;
    --track: #e4d9c2;
    --display: "KalamBold", "Kalam", "Comic Sans MS", cursive;
    --hand: "PatrickHand", "Patrick Hand", "Segoe Print", "Comic Sans MS", cursive;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141a33; --card: #1b2343; --ink: #efe8d8; --ink-soft: #aab0c8; --rule: #323b63;
      --red: #f08a6a; --moss: #9ccc7a; --track: #2a3359; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141a33; --card: #1b2343; --ink: #efe8d8; --ink-soft: #aab0c8; --rule: #323b63;
    --red: #f08a6a; --moss: #9ccc7a; --track: #2a3359; color-scheme: dark;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 18px/1.45 var(--hand);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 40px;
  }
  .page { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
  .masthead h1 { font: 46px/1.05 var(--display); margin: 0; text-wrap: balance; }
  .masthead p { margin: 6px 0 0; color: var(--ink-soft); }
  .sheet { border: 3px solid var(--ink); border-radius: 6px; overflow: hidden; background: #000; box-shadow: 6px 6px 0 var(--rule); max-width: 100%; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 760px) { .desk { grid-template-columns: minmax(0, 1fr); } .masthead h1 { font-size: 36px; } }
  .panel { background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 16px 18px; min-width: 0; }
  .panel h2 { font: 26px/1.1 var(--display); margin: 0 0 12px; }
  .channel { display: grid; gap: 4px; padding-block: 10px; border-top: 1px dashed var(--rule); }
  .channel:first-of-type { border-top: 0; padding-top: 0; }
  .channel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .channel-head label { font-size: 21px; }
  .readout { font: 14px var(--mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .channel-row { display: flex; gap: 12px; align-items: center; }
  input[type="range"] { flex: 1; min-width: 0; accent-color: var(--red); height: 28px; }
  .hint { margin: 0; font-size: 15px; color: var(--ink-soft); }
  button {
    font: 17px var(--hand); color: var(--ink); background: transparent; border: 2px solid var(--ink);
    border-radius: 4px; padding: 3px 12px; cursor: pointer;
  }
  button:hover { background: var(--track); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .mute.on { background: var(--red); border-color: var(--red); color: var(--card); }
  .actions { display: flex; gap: 10px; padding-block: 6px 12px; }
  .render { display: grid; gap: 8px; border-top: 1px dashed var(--rule); padding-top: 12px; }
  .render p { margin: 0; font-size: 16px; }
  .render code {
    display: block; font: 13px/1.5 var(--mono); background: var(--track); border-radius: 4px; padding: 8px 10px;
    overflow-x: auto; white-space: pre; max-width: 100%;
  }
  .render button { justify-self: start; }
  .parts ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .part {
    width: 100%; display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 10px; align-items: baseline;
    text-align: left; border: 0; border-left: 4px solid transparent; border-radius: 0; padding: 6px 8px;
  }
  .part .num { font: 15px var(--mono); color: var(--ink-soft); }
  .part .name { font-size: 19px; }
  .part .time { font: 14px var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .part .len { color: var(--ink-soft); }
  .part.active { border-left-color: var(--red); background: var(--track); }
  .loading { padding: 40px 0; color: var(--ink-soft); }
  .status { margin: -6px 0 10px; font-size: 15px; color: var(--ink-soft); }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<div id="app"><p class="loading">Loading the player…</p></div>
<script src="player.js"></script>
